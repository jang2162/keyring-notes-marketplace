# Ruler 설정. 지침 소스는 .ruler/, AGENTS.md·CLAUDE.md 등은 생성물이다(ruler apply).
default_agents = ["claude", "codex", "opencode"]
nested = false

[gitignore]
enabled = true

[agents.claude]
output_path = "AGENTS.md"

[mcp_servers.context7]
type = "stdio"
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
